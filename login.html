<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NX TWEAKER — Authentication</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="login.css?v=3">
</head>

<body>

    <!-- Custom Desktop Titlebar -->
    <div class="custom-titlebar" id="customTitlebar">
        <div class="titlebar-left">
            <img src="./img/nx.png" alt="Logo" class="titlebar-icon">
            <span class="titlebar-text">NX Tweaker</span>
            <span class="titlebar-badge">AUTH</span>
        </div>
        <div class="titlebar-drag-region" id="titlebarDrag"></div>
        <div class="titlebar-controls">
            <button class="win-control-btn" id="winMinimize" title="Minimize"><i class="fas fa-minus"></i></button>
            <button class="win-control-btn" id="winMaximize" title="Maximize"><i class="far fa-square"></i></button>
            <button class="win-control-btn close" id="winClose" title="Close"><i class="fas fa-times"></i></button>
        </div>
    </div>

    <!-- Floating Toast Notification System -->
    <div class="status-container">
        <div id="statusMessage" class="status-message">
            <div class="status-icon" id="statusIcon"></div>
            <div class="status-text-wrap">
                <div class="status-text" id="statusTitle"></div>
                <div class="status-subtext" id="statusDesc"></div>
            </div>
            <div class="status-progress" id="statusProgress"></div>
        </div>
    </div>

    <!-- Ambient High-Tech Background -->
    <div class="bg-container">
        <div class="bg-radial-glow"></div>
        <div class="bg-orb orb-1"></div>
        <div class="bg-orb orb-2"></div>
        <div class="bg-grid-overlay"></div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <div class="login-wrapper">

            <!-- Brand Header -->
            <div class="login-brand">
                <div class="brand-logo-frame">
                    <img src="./img/nx.png" alt="NX Logo" class="brand-logo-img">
                    <div class="brand-logo-glow"></div>
                </div>
                <div class="brand-title">NX <span>TWEAKER</span></div>
                <div class="brand-badge-wrap">
                    <span class="brand-badge">PRO v4.8</span>
                    <span class="brand-status-dot"></span>
                    <span class="brand-status-label">Authentication Portal</span>
                </div>
            </div>

            <!-- Login Glass Card -->
            <div class="login-card">

                <div class="card-header">
                    <div class="card-header-icon">
                        <i class="fas fa-key"></i>
                    </div>
                    <div>
                        <div class="card-header-title">Enter License Key</div>
                        <div class="card-header-sub">Input your product key to unlock full optimization suite</div>
                    </div>
                </div>

                <form class="login-form" id="loginForm">
                    <div class="form-group">
                        <label class="form-label" for="license">
                            <span>License Key</span>
                            <span class="label-hint">Paste / Format</span>
                        </label>

                        <div class="input-container" id="inputContainer">
                            <i class="fas fa-shield-alt input-left-icon"></i>
                            <input
                                type="text"
                                id="license"
                                class="form-input"
                                placeholder="XXXX-XXXX-XXXX-XXXX"
                                autocomplete="off"
                                spellcheck="false"
                                required
                            />
                            <button type="button" class="input-clear-btn" id="clearBtn" title="Clear">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="submit-button" id="accessButton" disabled>
                        <span class="btn-ripple" id="btnRipple"></span>
                        <i class="fas fa-bolt" id="buttonIcon"></i>
                        <span id="buttonText">ENTER LICENSE KEY</span>
                    </button>
                </form>

                <div class="login-help">
                    <a href="https://discord.gg/nxtools" class="help-link" target="_blank">
                        <i class="fab fa-discord"></i>
                        <span>Need a license? Join our Discord</span>
                    </a>
                </div>

                <div class="login-divider">
                    <span>CONNECT WITH US</span>
                </div>

                <div class="social-buttons">
                    <a href="https://discord.gg/nxtools" class="social-button" target="_blank" title="Discord">
                        <i class="fab fa-discord"></i>
                    </a>
                    <a href="https://t.me/NxStoreofficial" class="social-button" target="_blank" title="Telegram">
                        <i class="fab fa-telegram"></i>
                    </a>
                    <a href="https://www.tiktok.com/@nxgaming_?_r=1&_t=ZS-97KkUAQ5Tj3" class="social-button" target="_blank" title="TikTok">
                        <i class="fab fa-tiktok"></i>
                    </a>
                    <a href="https://www.youtube.com/@NXGAMMING_OFFICAL" class="social-button" target="_blank" title="YouTube">
                        <i class="fab fa-youtube"></i>
                    </a>
                </div>

            </div>

            <!-- Footer Details -->
            <div class="login-footer">
                <span><i class="fas fa-lock"></i> Protected by NX Security Engine</span>
                <span class="footer-separator">•</span>
                <span>v4.8 Stable</span>
            </div>

        </div>
    </div>



    <script>
        const licenseInput = document.getElementById('license');
        const accessButton = document.getElementById('accessButton');
        const buttonText = document.getElementById('buttonText');
        const buttonIcon = document.getElementById('buttonIcon');
        const clearBtn = document.getElementById('clearBtn');
        const loginForm = document.getElementById('loginForm');
        let isAuthenticating = false;
        let statusTimeout = null;

        function showStatusMessage(type, mainText, subText = '', duration = 4000) {
            const statusMessage = document.getElementById('statusMessage');
            const statusIcon = document.getElementById('statusIcon');
            const statusTitle = document.getElementById('statusTitle');
            const statusDesc = document.getElementById('statusDesc');

            if (statusTimeout) {
                clearTimeout(statusTimeout);
                statusTimeout = null;
            }

            statusMessage.className = 'status-message';
            statusTitle.textContent = mainText;
            statusDesc.textContent = subText;
            statusDesc.style.display = subText ? 'block' : 'none';

            if (type === 'success') {
                statusMessage.classList.add('success', 'show');
                statusIcon.innerHTML = '<i class="fas fa-check-circle"></i>';
            } else if (type === 'error') {
                statusMessage.classList.add('error', 'show');
                statusIcon.innerHTML = '<i class="fas fa-exclamation-triangle"></i>';
            } else if (type === 'loading') {
                statusMessage.classList.add('loading', 'show');
                statusIcon.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>';
            }

            if (type !== 'loading' && duration > 0) {
                statusTimeout = setTimeout(() => {
                    hideStatusMessage();
                }, duration);
            }
        }

        function hideStatusMessage() {
            const statusMessage = document.getElementById('statusMessage');
            statusMessage.classList.remove('show');
        }

        // License input live handler
        licenseInput.addEventListener('input', function() {
            // Auto uppercase
            const val = this.value.toUpperCase();
            if (this.value !== val) {
                this.value = val;
            }

            if (this.value.trim().length > 0) {
                clearBtn.classList.add('visible');
                if (!isAuthenticating) {
                    accessButton.disabled = false;
                    buttonText.textContent = 'ACCESS TOOL';
                    buttonIcon.className = 'fas fa-arrow-right';
                }
            } else {
                clearBtn.classList.remove('visible');
                if (!isAuthenticating) {
                    accessButton.disabled = true;
                    buttonText.textContent = 'ENTER LICENSE KEY';
                    buttonIcon.className = 'fas fa-bolt';
                }
            }
        });

        // Clear button
        clearBtn.addEventListener('click', () => {
            licenseInput.value = '';
            licenseInput.focus();
            clearBtn.classList.remove('visible');
            if (!isAuthenticating) {
                accessButton.disabled = true;
                buttonText.textContent = 'ENTER LICENSE KEY';
                buttonIcon.className = 'fas fa-bolt';
            }
        });

        // Form Submission
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const license = licenseInput.value.trim();
            if (!license || isAuthenticating) return;

            isAuthenticating = true;
            accessButton.disabled = true;
            buttonIcon.className = 'fas fa-circle-notch fa-spin';
            buttonText.textContent = 'AUTHENTICATING...';
            licenseInput.disabled = true;

            showStatusMessage('loading', 'Verifying License Key', 'Authenticating with NX Security Server...', 0);

            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage(license);
            } else {
                // Browser simulation fallback for testing
                setTimeout(() => {
                    showStatusMessage('error', 'Native Host Offline', 'WebView2 bridge not found. Launch through NX TWEAKER.exe', 5000);
                    resetForm();
                }, 1200);
            }
        });

        function resetForm() {
            isAuthenticating = false;
            licenseInput.disabled = false;
            licenseInput.focus();
            if (licenseInput.value.trim().length > 0) {
                accessButton.disabled = false;
                buttonText.textContent = 'ACCESS TOOL';
                buttonIcon.className = 'fas fa-arrow-right';
            } else {
                accessButton.disabled = true;
                buttonText.textContent = 'ENTER LICENSE KEY';
                buttonIcon.className = 'fas fa-bolt';
            }
        }

        // WebView2 C++ bridge message listener
        if (window.chrome && window.chrome.webview) {
            window.chrome.webview.addEventListener('message', event => {
                const data = event.data;
                if (data === "success") {
                    showStatusMessage(
                        'success',
                        'License Verified Successfully!',
                        'Welcome to NX Tweaker Pro • Launching interface...',
                        5000
                    );
                    buttonIcon.className = 'fas fa-check-circle';
                    buttonText.textContent = 'AUTHORIZED';
                    accessButton.classList.add('authorized');
                } else {
                    showStatusMessage(
                        'error',
                        'Invalid or Expired License Key',
                        'Please verify your key or contact support on Discord',
                        6000
                    );
                    resetForm();
                }
            });
        }

        // Native Window Controls & Dragging Bridge
        const minBtn = document.getElementById("winMinimize");
        const maxBtn = document.getElementById("winMaximize");
        const closeBtn = document.getElementById("winClose");
        const dragRegion = document.getElementById("titlebarDrag");
        const titlebar = document.getElementById("customTitlebar");

        if (minBtn) {
            minBtn.addEventListener("click", () => {
                if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage("window-minimize");
                }
            });
        }

        if (maxBtn) {
            maxBtn.addEventListener("click", () => {
                if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage("window-maximize");
                }
            });
        }

        if (closeBtn) {
            closeBtn.addEventListener("click", () => {
                if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage("window-close");
                }
            });
        }

        if (dragRegion) {
            dragRegion.addEventListener("mousedown", (e) => {
                if (e.button === 0) {
                    if (window.chrome && window.chrome.webview) {
                        window.chrome.webview.postMessage("window-drag");
                    }
                }
            });
        }

        if (titlebar) {
            titlebar.addEventListener("mousedown", (e) => {
                if (e.button === 0 && !e.target.closest(".win-control-btn")) {
                    if (window.chrome && window.chrome.webview) {
                        window.chrome.webview.postMessage("window-drag");
                    }
                }
            });

            titlebar.addEventListener("dblclick", (e) => {
                if (!e.target.closest(".win-control-btn")) {
                    if (window.chrome && window.chrome.webview) {
                        window.chrome.webview.postMessage("window-maximize");
                    }
                }
            });
        }


    </script>
</body>

</html>
